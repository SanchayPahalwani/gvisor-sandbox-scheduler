# Grafana dashboard provider for the grafana/otel-lgtm container (D24).
# scripts/obs.sh mounts this file as
# /otel-lgtm/grafana/conf/provisioning/dashboards/gss.yaml and dashboard.json
# into the directory below, the paths the image's README gives for custom
# dashboards.
apiVersion: 1

providers:
  - name: gss
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/gss
      foldersFromFilesStructure: false
